[project]
name = "orcamento-pipeline"
version = "0.1.0"
description = "Baixa e organiza os dados do orçamento federal (Portal da Transparência) para o site."
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "duckdb>=1.1",
]

[project.scripts]
orcamento = "orcamento_pipeline.cli:main"
cidades = "orcamento_pipeline.cidades:main"
finbra = "orcamento_pipeline.finbra:main"
mapa = "orcamento_pipeline.mapa:main"
federal = "orcamento_pipeline.federal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcamento_pipeline"]
