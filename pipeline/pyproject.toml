[project]
name = "orcamento-pipeline"
version = "0.1.0"
description = "Baixa e organiza os dados do orçamento federal (Portal da Transparência) para o site."
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "datasus-dbc>=0.1.3",
    "dbfread>=2.0.7",
    "duckdb>=1.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
orcamento = "orcamento_pipeline.cli:main"
cidades = "orcamento_pipeline.cidades:main"
rfb = "orcamento_pipeline.rfb:main"
irpf = "orcamento_pipeline.irpf:main"
finbra = "orcamento_pipeline.finbra:main"
mapa = "orcamento_pipeline.mapa:main"
federal = "orcamento_pipeline.federal:main"
inss = "orcamento_pipeline.inss:main"
semente = "orcamento_pipeline.semente:main"
rreo = "orcamento_pipeline.rreo:main"
ideb = "orcamento_pipeline.ideb:main"
matriculas = "orcamento_pipeline.matriculas:main"
divida = "orcamento_pipeline.divida:main"
divida-federal = "orcamento_pipeline.divida_federal:main"
contas-federal = "orcamento_pipeline.contas_federal:main"
capag = "orcamento_pipeline.capag:main"
saude = "orcamento_pipeline.saude:main"
pessoal = "orcamento_pipeline.pessoal:main"
seguranca = "orcamento_pipeline.seguranca:main"
saneamento = "orcamento_pipeline.saneamento:main"
populacao = "orcamento_pipeline.populacao:main"
emendas = "orcamento_pipeline.emendas:main"
escolas = "orcamento_pipeline.escolas:main"
unidades-saude = "orcamento_pipeline.unidades_saude:main"
contratos = "orcamento_pipeline.contratos:main"
explorador-contratos = "orcamento_pipeline.explorador_contratos:main"
explorador-emendas = "orcamento_pipeline.explorador_emendas:main"
espelho = "orcamento_pipeline.espelho:main"
conciliar = "orcamento_pipeline.conciliar:main"
estado-pb = "orcamento_pipeline.estado_pb:main"
estado-mg = "orcamento_pipeline.estado_mg:main"
estado-pr = "orcamento_pipeline.estado_pr:main"
estado-sc = "orcamento_pipeline.estado_sc:main"
pagamentos = "orcamento_pipeline.pagamentos:main"
receitas-uniao = "orcamento_pipeline.receitas_uniao:main"
gasto-federal = "orcamento_pipeline.gasto_federal:main"
caminho-impostos = "orcamento_pipeline.caminho_impostos:main"
previdencia = "orcamento_pipeline.previdencia:main"
divida-ativa = "orcamento_pipeline.divida_ativa:main"
supersalarios = "orcamento_pipeline.supersalarios:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcamento_pipeline"]
