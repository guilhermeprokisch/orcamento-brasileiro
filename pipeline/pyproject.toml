[project]
name = "orcamento-pipeline"
version = "0.1.0"
description = "Baixa e organiza os dados do orçamento federal (Portal da Transparência) para o site."
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "duckdb>=1.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
orcamento = "orcamento_pipeline.cli:main"
cidades = "orcamento_pipeline.cidades:main"
finbra = "orcamento_pipeline.finbra:main"
mapa = "orcamento_pipeline.mapa:main"
federal = "orcamento_pipeline.federal:main"
inss = "orcamento_pipeline.inss:main"
semente = "orcamento_pipeline.semente:main"
rreo = "orcamento_pipeline.rreo:main"
conciliar = "orcamento_pipeline.conciliar:main"
estado-pb = "orcamento_pipeline.estado_pb:main"
estado-mg = "orcamento_pipeline.estado_mg:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcamento_pipeline"]
