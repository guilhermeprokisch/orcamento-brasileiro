name: Publicar

# Atualiza os dados, gera o site e publica no Cloudflare Pages.
# - push na main: publica em produção (orcamento-brasileiro.pages.dev)
# - todo dia às 9h UTC (6h em Brasília): baixa os dados de novo e publica
# - pull request: gera e publica uma prévia (endereço próprio por branch)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  PROJETO_PAGES: orcamento-brasileiro

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Arquivos brutos dos anos fechados e nomes do SIOP não mudam: reaproveita.
      # O ano corrente é sempre baixado de novo pelo pipeline.
      - name: Cache dos dados brutos
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dados-brutos-${{ github.run_id }}
          restore-keys: dados-brutos-

      # Todos os programas de dados, em quatro filas ao mesmo tempo: a do SICONFI (uma consulta por segundo,
      # então em fila única), a dos independentes e as dos que esperam as cidades ou o mapa. A lista de passos,
      # o que cada um faz e quais podem falhar sem parar a publicação estão em .github/scripts/dados.sh.
      - name: Programas de dados (quatro filas)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/dados.sh

      # Nenhum arquivo de dados que está no ar pode sumir ou encolher mais da metade: se algum programa falhou
      # sem cópia de referência, a publicação para aqui e o site no ar fica como está. Grava o manifesto novo.
      - name: Conferir os dados
        run: python3 .github/scripts/conferir-dados.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências do site
        working-directory: site
        run: npm ci

      - name: Verificar tipos
        working-directory: site
        run: npx astro check

      - name: Gerar o site
        working-directory: site
        run: npm run build

      - name: Publicar no Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site
        env:
          RAMO: ${{ github.head_ref || github.ref_name }}
        run: |
          # Cria o projeto na primeira vez (falha sem problema se já existir).
          npx wrangler pages project create "$PROJETO_PAGES" --production-branch main || true
          npx wrangler pages deploy dist --project-name "$PROJETO_PAGES" --branch "$RAMO" --commit-dirty=true

      - name: Aviso sem credenciais
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Site gerado, mas não publicado — faltam os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID."

      # Cópia pública dos dados (brutos e tratados) no Backblaze B2, só na main. Envia apenas o que
      # mudou de tamanho; nada é apagado lá. Ver pipeline/src/orcamento_pipeline/espelho.py.
      - name: Cópia pública dos dados (Backblaze B2)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: uv run --project pipeline espelho

      # Os nomes dos arquivos do espelho são fixos e sobrescritos a cada publicação, e a regra de
      # cache da Cloudflare guarda cada um por 30 dias. Sem esta purga, a borda continuaria servindo
      # pedaços do Parquet anterior — misturados com os novos, o que faz o DuckDB ler lixo.
      # Precisa de um token com a permissão Zone → Cache Purge (não serve o do Pages).
      - name: Limpar o cache do espelho
        if: github.ref == 'refs/heads/main' && env.CF_PURGE_TOKEN != '' && env.CF_ZONE_ID != ''
        continue-on-error: true
        run: |
          curl -sS --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["dados.orcamentobrasileiro.com.br"]}'

      - name: Aviso sem purga
        if: github.ref == 'refs/heads/main' && (env.CF_PURGE_TOKEN == '' || env.CF_ZONE_ID == '')
        run: echo "::warning::Dados publicados, mas o cache de dados.orcamentobrasileiro.com.br não foi limpo — faltam os secrets CF_PURGE_TOKEN e CF_ZONE_ID. A borda pode servir Parquet antigo por até 30 dias."
