name: Publicar

# Atualiza os dados, gera o site e publica no Cloudflare Pages.
# - push na main: publica em produção (orcamento-brasileiro.pages.dev)
# - todo dia às 9h UTC (6h em Brasília): baixa os dados de novo e publica
# - pull request: gera e publica uma prévia (endereço próprio por branch)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  PROJETO_PAGES: orcamento-brasileiro

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Arquivos brutos dos anos fechados e nomes do SIOP não mudam: reaproveita.
      # O ano corrente é sempre baixado de novo pelo pipeline.
      - name: Cache dos dados brutos
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dados-brutos-${{ github.run_id }}
          restore-keys: dados-brutos-

      - name: Pipeline de dados
        run: uv run --project pipeline orcamento

      # Histórico dos municípios (FINBRA, baixado à mão por causa do captcha): vem do
      # release "dados-siconfi" e preenche o que falta no cache. Só baixa de novo quando
      # o release muda. Sem ele, o site sai sem a receita e o histórico das cidades.
      - name: Cache do SICONFI (release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run --project pipeline semente aplicar

      # Estados e municípios. A API do SICONFI responde um ente por vez e tem limite
      # documentado de 1 requisição por segundo: são ~11 mil consultas na primeira vez.
      # O limite (~17 min) deixa o resto para as execuções seguintes (o cache de
      # data/raw acumula); depois disso só são consultadas as prefeituras que ainda
      # não tinham entregado.
      - name: Pipeline de estados e cidades (SICONFI)
        run: uv run --project pipeline cidades --max-chamadas 1000

      # Dados da página /mapa: receita, tributos e áreas de gasto por ano, a partir dos
      # caches do SICONFI (os anos importados do FINBRA vêm do release, no passo acima).
      - name: Pipeline do mapa
        run: uv run --project pipeline mapa --max-chamadas 300

      # Arrecadação federal em cada município (planilhas da Receita Federal). Se falhar, o mapa
      # volta a estimar o imposto federal de cada cidade pelo peso dela no ICMS do estado.
      - name: Pipeline da arrecadação federal por município
        continue-on-error: true
        run: uv run --project pipeline rfb

      - name: Pipeline do imposto de renda por cidade de residência
        continue-on-error: true
        run: uv run --project pipeline irpf

      # Dinheiro federal por município. O Portal da Transparência às vezes responde com
      # CAPTCHA a downloads automáticos: se falhar, o site é publicado sem essa camada.
      - name: Pipeline do dinheiro federal
        continue-on-error: true
        run: uv run --project pipeline federal 2025

      # Aposentadorias e pensões do INSS por município (13 planilhas pequenas do gov.br).
      - name: Pipeline do INSS
        continue-on-error: true
        run: uv run --project pipeline inss

      # O ano em andamento, pelo relatório bimestral (RREO): os estados vêm da API (54
      # consultas quando muda o bimestre); os municípios, do release, que o workflow
      # "Relatório bimestral dos municípios" (bimestral.yml) mantém atualizado.
      - name: Pipeline do ano em andamento (RREO)
        continue-on-error: true
        run: uv run --project pipeline rreo --max-chamadas 200

      # Gasto do governo da Paraíba por município, empenho a empenho (API aberta do estado,
      # ~50 consultas). Se a API falhar, as cidades paraibanas saem sem essa seção.
      - name: Pipeline do gasto estadual localizado (PB)
        continue-on-error: true
        run: uv run --project pipeline estado-pb 2025

      # Gasto do governo de Minas Gerais distribuído por município (arquivos pequenos do
      # portal de dados abertos do estado). Se falhar, as cidades mineiras saem sem a seção.
      - name: Pipeline do gasto estadual localizado (MG)
        continue-on-error: true
        run: uv run --project pipeline estado-mg 2025

      # Ideb por município e rede (INEP), para pôr a nota ao lado do gasto em educação.
      # O INEP costuma recusar conexões dos servidores do GitHub: nesse caso o comando usa a
      # cópia versionada em pipeline/referencia/ideb.json (o Ideb só muda a cada dois anos).
      - name: Pipeline do Ideb
        continue-on-error: true
        run: uv run --project pipeline ideb

      # Matrículas por município (Censo Escolar). Como o Ideb, usa a cópia versionada em
      # pipeline/referencia quando o INEP derruba a conexão do servidor do GitHub.
      # Escolas da rede municipal: Censo Escolar, Ideb por escola e PDDE. O INEP recusa conexões de
      # fora do país: sem o download, a saída vem de pipeline/referencia/escolas.json.
      - name: Pipeline das escolas
        continue-on-error: true
        run: uv run --project pipeline escolas

      # Postos e hospitais (CNES) e internações pelo SUS por hospital (SIH): ~1 GB de arquivos do
      # DATASUS, baixados à mão; aqui só a cópia em pipeline/referencia/ vai para o site.
      - name: Postos e hospitais
        continue-on-error: true
        run: uv run --project pipeline unidades-saude --sem-baixar

      - name: Pipeline das matrículas
        continue-on-error: true
        run: uv run --project pipeline matriculas

      # Dívida dos governos estaduais (RGF, Anexo 2): 27 consultas por ano à API do SICONFI.
      # O cache em data/raw guarda os anos já baixados; sem ele, são ~300 consultas (5 minutos).
      - name: Pipeline da dívida dos estados
        continue-on-error: true
        run: uv run --project pipeline divida

      # Dívida das prefeituras: ~5.570 consultas por ano, feitas à mão (uv run divida --prefeituras). Aqui
      # só a cópia em pipeline/referencia/ vai para o site, sem consultas: as que faltam não têm o dado.
      - name: Pipeline da dívida das prefeituras
        continue-on-error: true
        run: uv run --project pipeline divida --prefeituras --max-chamadas 0

      # Contratos das prefeituras (PNCP): baixar um ano leva horas e o portal limita os pedidos, então a
      # carga é feita à mão e fica em pipeline/referencia/contratos.json; aqui só vai para o site.
      - name: Contratos das prefeituras
        continue-on-error: true
        run: uv run --project pipeline contratos --sem-baixar

      # Nota de capacidade de pagamento (CAPAG) do Tesouro: a versão mais recente, para prefeituras e estados.
      - name: Pipeline da CAPAG
        continue-on-error: true
        run: uv run --project pipeline capag

      - name: Pipeline da saúde (mortalidade infantil)
        continue-on-error: true
        run: uv run --project pipeline saude

      - name: Pipeline da população de cada ano (IBGE)
        continue-on-error: true
        run: uv run --project pipeline populacao

      - name: Pipeline da segurança (homicídios)
        continue-on-error: true
        run: uv run --project pipeline seguranca

      - name: Pipeline do saneamento (Censo 2022)
        continue-on-error: true
        run: uv run --project pipeline saneamento

      - name: Pipeline das emendas parlamentares (CGU)
        continue-on-error: true
        run: uv run --project pipeline emendas

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências do site
        working-directory: site
        run: npm ci

      - name: Verificar tipos
        working-directory: site
        run: npx astro check

      - name: Gerar o site
        working-directory: site
        run: npm run build

      - name: Publicar no Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: site
        env:
          RAMO: ${{ github.head_ref || github.ref_name }}
        run: |
          # Cria o projeto na primeira vez (falha sem problema se já existir).
          npx wrangler pages project create "$PROJETO_PAGES" --production-branch main || true
          npx wrangler pages deploy dist --project-name "$PROJETO_PAGES" --branch "$RAMO" --commit-dirty=true

      - name: Aviso sem credenciais
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Site gerado, mas não publicado — faltam os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID."

      # Cópia pública dos dados (brutos e tratados) no Backblaze B2, só na main. Envia apenas o que
      # mudou de tamanho; nada é apagado lá. Ver pipeline/src/orcamento_pipeline/espelho.py.
      - name: Cópia pública dos dados (Backblaze B2)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: uv run --project pipeline espelho
