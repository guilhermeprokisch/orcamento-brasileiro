name: Instagram

# Publica um post do @orcamentobrasileiro a partir de uma pasta em divulgacao/instagram/posts/
# (legenda.txt e midia.json; as imagens já estão no bucket, enviadas da máquina com --enviar).
# Só roda à mão: Actions → Instagram → Run workflow, ou
#   gh workflow run instagram.yml -f post=<pasta> -f postar=true
# Sem "postar", só mostra o que seria publicado e confere o token.
# Num pull request que mexe aqui, confere o token e se cada pasta tem legenda e midia.json.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Pasta em divulgacao/instagram/posts/"
        required: true
      postar:
        description: "Publicar de verdade"
        type: boolean
        default: false
  pull_request:
    paths:
      - "divulgacao/instagram/**"
      - ".github/workflows/instagram.yml"

concurrency:
  group: instagram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
    defaults:
      run:
        working-directory: divulgacao/instagram
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Conferir o token
        run: uv run --no-project --script publicar.py --teste

      - name: Conferir as pastas de post
        if: github.event_name == 'pull_request'
        run: |
          for p in posts/*/; do
            [ -f "$p/midia.json" ] || { echo "::error::$p sem midia.json (rode --enviar na máquina)"; exit 1; }
            uv run --no-project --script publicar.py "$p"
          done

      - name: Publicar
        if: github.event_name == 'workflow_dispatch'
        env:
          POST: ${{ inputs.post }}
          POSTAR: ${{ inputs.postar && '--postar' || '' }}
        run: uv run --no-project --script publicar.py "posts/$POST" $POSTAR
