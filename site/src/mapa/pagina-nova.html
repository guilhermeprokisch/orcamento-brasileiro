<!doctype html>
<html lang="pt-BR" data-dados="/data/mapa/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quanto se paga em impostos em cada lugar, como prefeitura, estado e governo federal usam o dinheiro, o que volta e se as contas fecham.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Mapa · Orçamento Brasileiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* O desenho segue o mock aprovado: menu à esquerda (o que olhar, onde, o que saber, como mostrar),
     mapa no meio dizendo o que a cor significa, e o detalhe da pergunta escolhida à direita,
     sempre dividido por prefeitura, governo do estado e governo federal. */
  :root {
    --papel: #f7f4ec; --papel-2: #eee9dc; --cartao: #fffdf7; --tinta: #191919; --texto-2: #4a4740;
    --regra: #c9c2b2; --regra-2: #b9b19c; --texto-3: #7a7466; --linha: #e6dfcd; --grupo: #f3eee1; --sem-dados: #ddd6c6;
    --pref: #1f7a47; --est: #8a5d10; --fed: #1d4f91;
    --serifa: "Source Serif 4", Georgia, serif;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--sans); font-size: 15px; line-height: 1.4; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--fed); outline-offset: 2px; }
  .app { display: flex; flex-wrap: wrap; min-height: 100vh; }

  /* ----- menu ----- */
  aside { flex: 1 1 290px; padding: 28px 24px; border-right: 1px solid var(--regra); display: flex; flex-direction: column; gap: 22px; }
  .rotulo { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-2); }
  .bloco { display: flex; flex-direction: column; gap: 8px; }
  .marca { display: flex; flex-direction: column; gap: 4px; }
  .marca a { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; color: var(--texto-2); }
  .marca h1 { margin: 0; font-family: var(--serifa); font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .tres, .dois { display: grid; gap: 6px; }
  .tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dois { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bt { min-height: 46px; padding: 4px 6px; border: 1.5px solid var(--regra-2); background: transparent; font-weight: 500; cursor: pointer; }
  .bt[aria-pressed="true"] { border-color: var(--tinta); background: var(--tinta); color: var(--papel); }
  .onde { position: relative; }
  .onde input { width: 100%; height: 46px; padding: 0 12px; border: 1.5px solid var(--tinta); background: var(--cartao); font-size: 16px; border-radius: 0; }
  .onde ul { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 0; padding: 0; list-style: none; background: var(--cartao); border: 1.5px solid var(--tinta); border-top: 0; max-height: 320px; overflow-y: auto; }
  .onde li button { display: flex; justify-content: space-between; gap: 10px; width: 100%; min-height: 44px; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--linha); background: none; text-align: left; cursor: pointer; }
  .onde li button:hover, .onde li button:focus-visible { background: var(--papel-2); }
  .onde li small { color: var(--texto-2); white-space: nowrap; }
  .dica { font-size: 13px; color: var(--texto-2); }
  .pe { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--regra); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; }
  .pe b { font-family: var(--serifa); font-size: 20px; font-weight: 700; }
  .pe button { padding: 0; border: 0; background: none; color: var(--texto-2); text-decoration: underline; cursor: pointer; min-height: 32px; }
  .opcoes { flex: 1 1 100%; display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
  .opcoes .ano { display: flex; align-items: center; gap: 10px; }
  .opcoes .ano input { flex: 1 1 auto; min-width: 0; accent-color: var(--tinta); }
  .opcoes label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .opcoes label input { margin-top: 3px; accent-color: var(--tinta); }

  /* ----- mapa ----- */
  main { flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .col-mapa { flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 28px; }
  .mostra { display: flex; flex-direction: column; gap: 2px; min-height: 96px; }
  .mostra p { margin: 0; font-family: var(--serifa); font-size: 21px; font-weight: 600; line-height: 1.22; }
  .mostra small { font-size: 12px; color: var(--texto-2); }
  .mapa-caixa { position: relative; width: 100%; aspect-ratio: 640 / 660; max-height: 580px; overflow: hidden; }
  #mapa { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #mapa:active { cursor: grabbing; }
  #mapa path { vector-effect: non-scaling-stroke; }
  #mapa path.mun { stroke: var(--papel); stroke-width: .25; cursor: pointer; }
  #mapa path.ufsel { stroke: var(--papel); stroke-width: 1; cursor: pointer; }
  #mapa path.uf { fill: none; pointer-events: none; stroke: rgba(25, 25, 25, .45); stroke-width: .7; }
  #mapa path.ativo { stroke: var(--tinta); stroke-width: 2.5; }
  .zoom { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; gap: 4px; }
  .zoom button { width: 34px; height: 34px; padding: 0; border: 1.5px solid var(--regra-2); background: var(--papel); font-size: 17px; line-height: 1; cursor: pointer; }
  .pino { position: absolute; left: 0; top: 0; pointer-events: none; }
  .pino i { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--papel); border: 2.5px solid var(--tinta); }
  .pino svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .pino line { stroke: var(--tinta); stroke-width: 1.5; }
  .pino b { position: absolute; left: 21px; top: 40px; padding: 5px 10px; background: var(--tinta); color: var(--papel); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .balao { position: absolute; z-index: 3; pointer-events: none; padding: 5px 9px; background: var(--cartao); border: 1px solid var(--tinta); font-size: 13px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
  .leg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-2); }
  .leg span.faixas { display: flex; }
  .leg i { display: block; width: 28px; height: 14px; }
  .leg .sem { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
  .leg .sem i { width: 14px; background: var(--sem-dados); }

  /* ----- cartão do lugar: o desenho do mapa em produção, com as perguntas que abrem e fecham ----- */
  .det { flex: 1 1 380px; min-width: 0; padding: 16px 18px; background: var(--papel); border: 1px solid var(--tinta); display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .det h2 { margin: 0; font-family: var(--serifa); font-size: 24px; line-height: 1.1; text-wrap: balance; }
  .det .sub { font-size: 11.5px; color: var(--texto-3); letter-spacing: .04em; text-transform: uppercase; }
  .blocos { display: flex; flex-direction: column; }
  .pergunta { border-top: 1px solid var(--tinta); }
  .pergunta:last-child { border-bottom: 1px solid var(--tinta); }
  .pergunta > button { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; padding: 9px 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .pergunta > button span { font-family: var(--serifa); font-size: 16.5px; font-weight: 600; }
  .pergunta > button span::before { content: "+"; display: inline-block; width: 16px; font-family: var(--sans); font-weight: 400; color: var(--texto-3); }
  .pergunta > button[aria-expanded="true"] span::before { content: "−"; }
  .pergunta > button b { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bloco-corpo { display: flex; flex-direction: column; gap: 8px; padding: 0 0 12px; }
  .bloco-nota { margin: 0; font-size: 13px; color: var(--texto-2); }
  .barra { display: flex; gap: 2px; height: 6px; }
  .gov { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px; margin: 6px 0 0; font-family: var(--sans); font-size: 12.5px; font-weight: 600; }
  .gov i { flex: none; align-self: center; width: 9px; height: 9px; background: var(--cor); }
  .gov small { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-3); border: 1px solid var(--regra); padding: 0 4px; }
  .gov em { font-style: normal; font-variant-numeric: tabular-nums; }
  .gov button { margin-left: auto; padding: 3px 0; border: 0; background: none; font-size: 11px; font-weight: 400; color: var(--texto-3); text-decoration: underline; cursor: pointer; }
  .gov button[aria-pressed="true"] { color: var(--tinta); font-weight: 600; text-decoration: none; }
  .linhas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .linhas li { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid var(--regra); }
  .linhas li span { color: var(--texto-2); min-width: 0; }
  .linhas li em { font-style: normal; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .comp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .comp caption { text-align: left; font-size: 12px; font-weight: 600; color: var(--texto-2); padding-bottom: 4px; }
  .comp th, .comp td { padding: 3px 0; border-bottom: 1px solid var(--regra); font-variant-numeric: tabular-nums; }
  .comp thead th { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-3); text-align: right; }
  .comp tbody th { text-align: left; font-weight: 400; color: var(--texto-2); }
  .comp td { text-align: right; padding-left: 8px; white-space: nowrap; }
  .comp td:nth-child(3) { color: var(--texto-3); }
  .comp .sinal { font-size: 11px; color: var(--texto-3); }
  .serie { display: flex; align-items: flex-end; gap: 4px; height: 56px; }
  .serie button { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; padding: 0; border: 0; background: none; cursor: pointer; }
  .serie .colunas { flex: 1; width: 100%; display: flex; align-items: flex-end; gap: 1px; }
  .serie .b { flex: 1; background: var(--pref); opacity: .8; }
  .serie .b.rec { background: var(--fed); opacity: .5; }
  .serie .b.falta { background: repeating-linear-gradient(45deg, var(--regra) 0 3px, transparent 3px 6px); opacity: 1; }
  .serie em { font-style: normal; font-size: 10px; color: var(--texto-3); font-variant-numeric: tabular-nums; }
  .serie .atual em { color: var(--tinta); font-weight: 700; }
  .serie .atual .colunas { outline: 1px solid var(--tinta); outline-offset: 1px; }
  .nota { margin: 0; font-size: 11px; color: var(--texto-3); line-height: 1.45; }
  .nota .q { display: inline-block; width: 9px; height: 9px; margin: 0 3px 0 2px; background: var(--pref); opacity: .8; }
  .nota .q.rec { background: var(--fed); opacity: .5; }
  .aviso { margin: 0; font-size: 13px; color: var(--texto-2); }
  .links { margin: 0; font-size: 12.5px; color: var(--texto-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .links a { color: var(--tinta); }
  .links a i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; background: var(--cor); }

  /* Em tela larga a página não rola: o mapa ocupa toda a área ao lado do menu, e a frase, a legenda
     e o detalhe flutuam por cima dele. O Brasil é encaixado na parte que o detalhe não cobre (ver medir). */
  @media (min-width: 1101px) {
    :root { --painel: 428px; }
    .app { flex-wrap: nowrap; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
    aside { flex: 0 0 290px; overflow-y: auto; }
    main { flex: 1 1 auto; position: relative; display: block; height: 100%; padding: 0; }
    .col-mapa { position: absolute; inset: 0; display: block; }
    .mapa-caixa { position: absolute; inset: 0; z-index: 0; aspect-ratio: auto; max-height: none; }
    .mostra, .leg { position: absolute; z-index: 2; left: 24px; background: var(--papel); border: 1px solid var(--regra); }
    .mostra { top: 24px; min-height: 0; max-width: min(520px, calc(100% - var(--painel) - 140px)); padding: 12px 16px; }
    .leg { bottom: 24px; padding: 8px 12px; }
    .zoom { left: auto; top: 24px; right: calc(var(--painel) + 48px); }
    .det { position: absolute; z-index: 3; top: 24px; right: 24px; width: var(--painel); max-height: calc(100% - 48px); overflow-y: auto; box-shadow: 0 8px 24px rgba(25, 25, 25, .12); }
  }
  @media (max-width: 760px) {
    aside { padding: 16px; gap: 14px; border-right: 0; border-bottom: 1px solid var(--regra); }
    .marca h1 { font-size: 22px; }
    .pe { margin-top: 0; }
    main { padding: 16px; gap: 18px; }
    .col-mapa { position: static; }
    .mostra { min-height: 0; }
    .det { padding: 14px 16px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside aria-label="Menu do mapa">
    <div class="marca">
      <a href="/">← Orçamento Brasileiro</a>
      <h1>Mapa do Orçamento</h1>
    </div>
    <div class="bloco">
      <span class="rotulo">1 · O que você quer olhar</span>
      <div class="tres" role="group" aria-label="O que você quer olhar">
        <button type="button" class="bt" data-nivel="brasil" aria-pressed="true">Brasil</button>
        <button type="button" class="bt" data-nivel="estado" aria-pressed="false">Estado</button>
        <button type="button" class="bt" data-nivel="cidade" aria-pressed="false">Cidade</button>
      </div>
    </div>
    <div class="bloco">
      <label class="rotulo" for="onde">2 · Onde</label>
      <div class="onde">
        <input type="text" id="onde" autocomplete="off" spellcheck="false" placeholder="O país inteiro: não precisa escolher">
        <ul id="onde-lista" hidden></ul>
      </div>
      <span class="dica">Escreva o nome ou clique no mapa.</span>
    </div>
    <div class="bloco">
      <span class="rotulo">Mostrar os valores</span>
      <div class="dois" role="group" aria-label="Mostrar os valores">
        <button type="button" class="bt" data-unidade="morador" aria-pressed="true">Por morador</button>
        <button type="button" class="bt" data-unidade="total" aria-pressed="false">Total</button>
      </div>
      <span class="dica" id="unidade-dica"></span>
    </div>
    <div class="pe">
      <b id="ano-rotulo">2025</b>
      <button type="button" id="abrir-ano" aria-expanded="false" aria-controls="opcoes">Mudar o ano</button>
      <button type="button" id="abrir-opcoes" aria-expanded="false" aria-controls="opcoes">Mais opções</button>
      <div class="opcoes" id="opcoes" hidden>
        <div class="ano">
          <span id="ano-min"></span>
          <input type="range" id="ano" step="1" aria-label="Ano das contas">
          <span id="ano-max"></span>
        </div>
        <label><input type="checkbox" id="real"><span>Corrigir pela inflação: mostra os valores de qualquer ano em reais de hoje, para comparar anos diferentes.</span></label>
      </div>
    </div>
  </aside>

  <main>
    <div class="col-mapa">
      <div class="mostra">
        <span class="rotulo">O mapa mostra</span>
        <p id="frase"></p>
        <small>O mapa compara sempre por morador, para lugares grandes e pequenos ficarem na mesma régua.</small>
      </div>
      <div class="mapa-caixa" id="caixa">
        <svg id="mapa" role="img" aria-label="Mapa do Brasil"></svg>
        <div class="zoom">
          <button type="button" id="zoom-mais" aria-label="Aproximar">+</button>
          <button type="button" id="zoom-menos" aria-label="Afastar">−</button>
          <button type="button" id="zoom-br" aria-label="Ver o Brasil inteiro">⌂</button>
        </div>
        <div class="pino" id="pino" hidden><svg width="1" height="1" aria-hidden="true"><line x1="0" y1="0" x2="49" y2="40"></line></svg><i></i><b></b></div>
        <div class="balao" id="balao" hidden></div>
      </div>
      <div class="leg" aria-hidden="true">
        <span id="leg-menos">menos</span>
        <span class="faixas" id="faixas"></span>
        <span id="leg-mais">mais</span>
        <span class="sem"><i></i>sem dado</span>
      </div>
    </div>
    <section class="det" id="det" aria-live="polite"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  window.addEventListener("unhandledrejection", () => {
    if (!$("det").innerHTML) $("det").innerHTML = `<p class="aviso">Dados do mapa não encontrados. Rode <code>uv run mapa</code> e <code>uv run federal 2025</code> no pipeline.</p>`;
  });
  // Colunas de cada registro do ano (mapa.py): população, despesa, áreas, receita e origem dela, tributos.
  const I = { pop: 0, desp: 1, saude: 2, edu: 3, seg: 4, pago: 5, rec: 6, propria: 7, uniao: 8, estado: 9, fundeb: 10, credito: 11,
    iptu: 12, iss: 13, itbi: 14, irrf: 15, taxas: 16, cosip: 17, outrosTrib: 18, cotaIcms: 19, cotaIpva: 20 };
  const TRIBUTOS = [["IPTU", I.iptu], ["ISS (imposto sobre serviços)", I.iss], ["ITBI (compra de imóveis)", I.itbi], ["Taxas", I.taxas], ["Iluminação pública", I.cosip], ["Outros tributos", I.outrosTrib]];
  const PUBLICA_POR_CIDADE = new Set(["PB", "MG"]);   // estados que divulgam o gasto do governo estadual em cada município
  const nf0 = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const reais = (v) => `R$ ${nf0.format(Math.round(v))}`;
  const curto = (v) => v >= 1e12 ? `R$ ${nf2.format(v / 1e12)} tri` : v >= 1e9 ? `R$ ${nf1.format(v / 1e9)} bi` : v >= 1e6 ? `R$ ${nf1.format(v / 1e6)} mi` : `R$ ${nf0.format(v / 1e3)} mil`;
  const semAcento = (t) => t.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase().trim();
  const slug = (t) => semAcento(t).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const BASE = document.documentElement.dataset.dados || "";
  const json = (u) => fetch(BASE + u).then((r) => { if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); });

  $("det").innerHTML = `<p class="aviso">Desenhando o mapa…</p>`;
  const SEM_FEDERAL = { ano: 0, mun: {}, meses_beneficios: { "novo-bolsa-familia": [], bpc: [] } };
  const [geoMun, geoUf, nomes, serie, ipca, rfb, federal] = await Promise.all([
    ...["municipios.geojson", "estados.geojson", "nomes.json", "serie.json", "ipca.json", "rfb.json"].map(json),
    json("federal-2025.json").catch(() => SEM_FEDERAL),
  ]);
  const ANO_MIN = serie.anos[0], ANO_MAX = serie.anos.at(-1);
  const SIGLA = Object.fromEntries(Object.entries(nomes.uf).map(([cod, [, sg]]) => [cod, sg]));

  // ----- dados de cada ano -----
  const porAno = {}, inssAno = {}, contasAno = {}, federalAno = {}, estadual = {};
  async function carregar(ano) {
    if (!porAno[ano]) {
      const [d, inss, contas] = await Promise.all([json(`anos/${ano}.json`), json(`inss/${ano}.json`).catch(() => ({})), json(`contas/${ano}.json`).catch(() => ({}))]);
      inssAno[ano] = inss; contasAno[ano] = contas; porAno[ano] = d;
    }
    return porAno[ano];
  }
  /** O orçamento do governo federal no ano, somado em poucas linhas. Vem do arquivo do Explorer, que é grande: chega depois. */
  function federalDe(ano) {
    if (!(ano in federalAno)) {
      federalAno[ano] = null;
      json(`../explorer/${ano}.json`).then((d) => {
        const c = d.colunas, f = c.indexOf("funcao"), g = c.indexOf("gnd"), e = c.indexOf("empenhado");
        let tot = 0, juros = 0, rol = 0; const F = {};
        for (const l of d.linhas) { const v = l[e] || 0; tot += v; F[l[f]] = (F[l[f]] || 0) + v; if (String(l[g]) === "2") juros += v; else if (String(l[g]) === "6") rol += v; }
        const de = (k) => F[k] || 0, divida = juros + rol;
        federalAno[ano] = { tot, juros, rol, linhas: [["Dívida (juros e troca de dívida velha por nova)", divida], ["Aposentadorias e pensões", de("09")],
          ["Repasses a estados e prefeituras e outros encargos", de("28") - divida], ["Assistência social (Bolsa Família, BPC)", de("08")], ["Saúde", de("10")], ["Educação", de("12")],
          ["Outras áreas", tot - de("28") - de("09") - de("08") - de("10") - de("12")]] };

    const t = semAcento(onde.value);
    if (t.length < 2) { lista.hidden = true; return; }
    const ordem = (x) => (x.t === t ? 0 : x.t.startsWith(t) ? 1 : 2) + (x.tipo === (estado.nivel === "estado" ? "estado" : "cidade") ? 0 : 0.5);
    const achados = indice.filter((x) => x.t.includes(t) || (x.tipo === "estado" && x.uf.toLowerCase() === t)).sort((a, b) => ordem(a) - ordem(b) || a.nome.localeCompare(b.nome, "pt-BR")).slice(0, 8);
    lista.innerHTML = achados.length ? achados.map((x) => `<li><button type="button" data-id="${x.id}"><span>${esc(x.nome)}</span><small>${x.tipo === "estado" ? "estado" : x.uf}</small></button></li>`).join("")
      : `<li><button type="button" disabled><span>Nenhum lugar com esse nome</span></button></li>`;
    lista.hidden = false;
  }
  function escolher(id) {
    lista.hidden = true; onde.blur();
    if (id.length === 2) definir({ nivel: "estado", uf: id });
    else definir({ nivel: "cidade", mun: id, uf: id.slice(0, 2) });
  }
  onde.addEventListener("input", buscar);
  onde.addEventListener("focus", () => onde.select());
  onde.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { lista.hidden = true; onde.blur(); }
    if (ev.key === "Enter") { const b = lista.querySelector("button[data-id]"); if (!lista.hidden && b) escolher(b.dataset.id); }
  });
  onde.addEventListener("blur", () => setTimeout(() => { if (!lista.contains(document.activeElement)) { lista.hidden = true; menu(conta()); } }, 150));
  lista.addEventListener("click", (ev) => { const b = ev.target.closest("button[data-id]"); if (b) escolher(b.dataset.id); });

  // ----- endereço: #br-a2025-q1, #e33-a2025-q2-gest, #c3303500-a2025-q1-total -----
  function escreverHash() {
    const lugar = estado.nivel === "brasil" ? "br" : estado.nivel === "estado" ? (estado.uf ? `e${estado.uf}` : "estados") : estado.mun ? `c${estado.mun}` : `cidades${estado.uf || ""}`;
    const h = [lugar, `a${estado.ano}`, estado.q, estado.grupo ? `g${estado.grupo}` : "", estado.unidade === "total" ? "total" : "", estado.real ? "real" : ""].filter(Boolean).join("-");
    if (location.hash.slice(1) !== h) history.replaceState(null, "", `#${h}`);
  }
  function lerHash() {
    const partes = location.hash.slice(1).split("-").filter(Boolean), m = { grupo: null, unidade: "morador", real: false };
    for (const p of partes) {
      if (p === "br") m.nivel = "brasil";
      else if (p === "estados") Object.assign(m, { nivel: "estado", uf: null });
      else if (/^cidades\d{0,2}$/.test(p)) Object.assign(m, { nivel: "cidade", mun: null, uf: nomes.uf[p.slice(7)] ? p.slice(7) : null });
      else if (/^e\d{2}$/.test(p) && nomes.uf[p.slice(1)]) Object.assign(m, { nivel: "estado", uf: p.slice(1) });
      else if (/^c\d{7}$/.test(p) && nomes.mun[p.slice(1)]) Object.assign(m, { nivel: "cidade", mun: p.slice(1), uf: p.slice(1, 3) });
      else if (/^a\d{4}$/.test(p) && +p.slice(1) >= ANO_MIN && +p.slice(1) <= ANO_MAX) m.ano = +p.slice(1);
      else if (/^q[1-4]$/.test(p)) m.q = p;
      else if (/^g(pref|est|fed)$/.test(p)) m.grupo = p.slice(1);
      else if (p === "total") m.unidade = "total";
      else if (p === "real") m.real = true;
    }
    return m;
  }
  addEventListener("hashchange", () => definir(lerHash()));

  medir();
  await definir(lerHash(), { zoom: false });
  enquadrar(alvoDoZoom(), false);
})();
</script>
</body>
